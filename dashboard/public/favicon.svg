<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blueprint Agent">
  <!-- Blueprint Agent favicon: 청사진 용지 위에 그려진 목업 와이어프레임 + 치수선 -->
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="64" height="64" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- 블루프린트 블루 용지 -->
    <rect width="64" height="64" fill="#0E2A5E" />

    <!-- 청사진 모눈 그리드 -->
    <g stroke="#3E6FBF" stroke-width="1" opacity="0.30">
      <path d="M8 0V64 M16 0V64 M24 0V64 M32 0V64 M40 0V64 M48 0V64 M56 0V64" />
      <path d="M0 8H64 M0 16H64 M0 24H64 M0 32H64 M0 40H64 M0 48H64 M0 56H64" />
    </g>

    <!-- 목업 와이어프레임 (설계도 라인) -->
    <g stroke="#EAF1FB" stroke-width="2" fill="none" stroke-linejoin="round">
      <!-- 프레임 외곽 -->
      <rect x="16" y="14" width="32" height="30" rx="2.5" />
      <!-- 헤더 바 -->
      <path d="M16 22 H48" stroke-width="1.6" />
    </g>
    <!-- 헤더 도트 (제어 버튼) -->
    <circle cx="20" cy="18" r="1.4" fill="#D97757" />
    <circle cx="24.5" cy="18" r="1.4" fill="#9DBDF0" />

    <!-- 콘텐츠 블록 (placeholder) -->
    <g fill="#9DBDF0" opacity="0.9">
      <rect x="20" y="26" width="12" height="3" rx="1.5" />
      <rect x="20" y="31" width="24" height="2" rx="1" opacity="0.7" />
      <rect x="20" y="35" width="20" height="2" rx="1" opacity="0.7" />
      <rect x="20" y="39" width="14" height="2" rx="1" opacity="0.55" />
    </g>

    <!-- 치수선 (dimension line) — 청사진 특유 요소 -->
    <g stroke="#D97757" stroke-width="1.4">
      <path d="M16 51 H48" />
      <path d="M16 48.5 V53.5 M48 48.5 V53.5" />
    </g>
  </g>
</svg>
