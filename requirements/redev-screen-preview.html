<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint Agent 대시보드 — 화면 예시</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes pulse-red { 0%,100%{opacity:1} 50%{opacity:.4} }
  .rec-pulse { animation: pulse-red 1s infinite; }
</style>
</head>
<body class="h-screen">
<!-- ponytail: 정적 목업. 상태 전환만 JS로. 실 백엔드/SSE/iframe 없음 -->
<div id="root" class="h-screen flex flex-col gap-2 p-2 bg-slate-100 text-slate-800 text-sm"></div>

<script>
// ── 샘플 데이터 ─────────────────────────────────────────
const SAMPLE = {
  project: "태스크-상세",
  transcript: [
    { who: "기획자", text: "태스크 상세 화면이 필요해요. 제목, 담당자, 마감일, 상태를 보여주고요." },
    { who: "사용자", text: "댓글도 달 수 있어야 해요. 그리고 상태는 드롭다운으로 바꾸게." },
    { who: "개발자", text: "첨부파일은요?" },
    { who: "사용자", text: "이번 버전엔 없어도 됩니다. 나중에." },
  ],
  brief: `# 요구사항 정의서 — 태스크 상세

## 개요
단일 태스크의 상세 정보를 확인·수정하는 화면.

## 기능 요구사항
- **FR-1** 태스크 제목/담당자/마감일/상태 표시
- **FR-2** 상태는 드롭다운으로 변경 (Todo / In Progress / Done)
- **FR-3** 댓글 목록 표시 및 작성

## 범위 외 (이번 버전)
- 첨부파일 업로드`,
  spec: `# SRS · ERD · OpenAPI — 태스크 상세

## 1. SRS
| ID | 요구사항 | 우선순위 |
|----|----------|----------|
| FR-1 | 태스크 상세 표시 | High |
| FR-2 | 상태 변경 | High |
| FR-3 | 댓글 CRUD | Medium |

## 2. ERD
\`\`\`
Task (id, title, assignee, dueDate, status)
  └─< Comment (id, taskId, author, body, createdAt)
\`\`\`

## 3. OpenAPI (발췌)
\`\`\`
GET  /tasks/{id}        → Task
PATCH /tasks/{id}       { status } → Task
POST /tasks/{id}/comments { body } → Comment
\`\`\``,
  contract: `project: 태스크-상세
version: 3
components:
  - TaskHeader: { title, assignee, dueDate }
  - StatusSelect: { options: [todo, in_progress, done] }
  - CommentList: { items: Comment[] }
tokens:
  color: { primary: "#0ea5e9", surface: "#ffffff" }`,
  code: `## 생성된 코드

\`\`\`tsx
// TaskDetail.tsx
export function TaskDetail({ task }: { task: Task }) {
  return (
    <div className="p-4">
      <h1 className="text-lg font-bold">{task.title}</h1>
      <StatusSelect value={task.status} />
      <CommentList items={task.comments} />
    </div>
  );
}
\`\`\``,
  codeFiles: ["TaskDetail.tsx", "StatusSelect.tsx", "api.ts"],
  versions: [
    { project: "태스크-상세", version: 3, createdAt: "2026-09-08", bytes: 12400, mode: "edit", baseVersion: 2 },
    { project: "태스크-상세", version: 2, createdAt: "2026-09-07", bytes: 11800, mode: "edit", baseVersion: 1 },
    { project: "태스크-상세", version: 1, createdAt: "2026-09-06", bytes: 9600, mode: "create" },
    { project: "칸반-보드", version: 1, createdAt: "2026-09-05", bytes: 8200, mode: "create" },
  ],
};

// ── 아주 작은 markdown 렌더 (제목/표/코드펜스/리스트만) ──
function md(src) {
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines = src.split("\n");
  let out = "", i = 0, inCode = false, code = "", tbl = [];
  const flushTbl = () => {
    if (!tbl.length) return;
    const rows = tbl.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
    out += '<table class="border-collapse my-2 text-xs"><tbody>';
    rows.forEach((r, ri) => {
      const cells = r.split("|").slice(1, -1).map(c => c.trim());
      const tag = ri === 0 ? "th" : "td";
      out += "<tr>" + cells.map(c => `<${tag} class="border px-2 py-1 ${ri===0?'bg-slate-100':''}">${esc(c)}</${tag}>`).join("") + "</tr>";
    });
    out += "</tbody></table>";
    tbl = [];
  };
  for (const ln of lines) {
    if (ln.startsWith("```")) {
      if (inCode) { out += `<pre class="bg-slate-800 text-slate-100 p-2 rounded my-2 overflow-auto text-xs"><code>${esc(code)}</code></pre>`; code=""; }
      inCode = !inCode; continue;
    }
    if (inCode) { code += ln + "\n"; continue; }
    if (ln.trim().startsWith("|")) { tbl.push(ln); continue; }
    flushTbl();
    if (/^### /.test(ln)) out += `<h3 class="font-bold mt-2">${esc(ln.slice(4))}</h3>`;
    else if (/^## /.test(ln)) out += `<h2 class="font-bold text-base mt-3">${esc(ln.slice(3))}</h2>`;
    else if (/^# /.test(ln)) out += `<h1 class="font-bold text-lg mt-1">${esc(ln.slice(2))}</h1>`;
    else if (/^[-*] /.test(ln)) out += `<li class="ml-4 list-disc">${esc(ln.slice(2)).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</li>`;
    else if (ln.trim()) out += `<p class="my-1">${esc(ln).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code class="bg-slate-200 px-1 rounded">$1</code>')}</p>`;
  }
  flushTbl();
  return out;
}

// ── 상태 ─────────────────────────────────────────
const S = {
  devMode: false,
  custView: "mockup",   // brief|mockup|spec
  tab: "mockup",        // mockup|brief|contract|spec|code|versions
  recording: false,
  maximized: false,
  err: null,
};

const CUST_VIEWS = [
  { k: "brief", label: "📋 요구사항" },
  { k: "mockup", label: "🖼 목업" },
  { k: "spec", label: "📄 SRS" },
];
const DEV_TABS = [
  { k: "mockup", label: "🖼 목업" },
  { k: "brief", label: "📋 브리프" },
  { k: "contract", label: "Contract" },
  { k: "spec", label: "📄 SRS" },
  { k: "code", label: "코드" },
  { k: "versions", label: "버전" },
];

function chatPanel() {
  const bubbles = SAMPLE.transcript.map(m => {
    const isUser = m.who === "사용자";
    return `<div class="flex flex-col ${isUser ? 'items-end' : 'items-start'} mb-2">
      <span class="text-[10px] text-slate-400">${m.who}</span>
      <div class="max-w-[85%] rounded px-2 py-1 ${isUser ? 'bg-blue-100' : 'bg-slate-100'}">${m.text}</div>
    </div>`;
  }).join("");
  return `<div class="flex flex-col h-full">
    <div class="font-bold shrink-0 mb-1">대화 (회의 녹취)</div>
    <div class="flex-1 overflow-auto border rounded bg-white p-2">${bubbles}</div>
    <div class="flex gap-1 mt-1 shrink-0">
      <input class="flex-1 border rounded px-2 py-1" placeholder="발언 입력 (Enter)">
      <button onclick="S.recording=!S.recording;render()" class="px-2 border rounded ${S.recording?'bg-red-500 text-white rec-pulse':'bg-white'}">${S.recording?'⏹':'🎤'}</button>
      <button class="px-2 border rounded bg-slate-800 text-white">보내기</button>
    </div>
  </div>`;
}

function versionChips() {
  const vs = SAMPLE.versions.filter(v => v.project === SAMPLE.project);
  const chips = vs.map((v, i) => {
    const color = i === 0 ? "bg-cyan-100 border-cyan-400" : v.mode === "edit" ? "bg-amber-100 border-amber-400" : "bg-slate-100 border-slate-300";
    return `<button class="text-xs border rounded px-2 py-1 ${color}" title="${v.createdAt} · ${v.project} · ${(v.bytes/1024).toFixed(1)}KB · ${v.mode==='edit'?'v'+v.baseVersion+'에서 수정':'신규 생성'}">v${v.version}${v.mode==='edit'?' ✏':''}</button>`;
  }).join("");
  return `<div class="shrink-0 mt-2">
    <div class="text-[10px] text-slate-400 mb-1">이전 버전 · ${SAMPLE.project}</div>
    <div class="flex flex-wrap gap-1">${chips || '<span class="text-slate-400">(없음)</span>'}</div>
  </div>`;
}

function mockupView() {
  return `<div class="h-full flex flex-col">
    <div class="flex items-center justify-between px-2 py-1 border-b bg-slate-50 shrink-0">
      <span class="text-xs text-slate-500">/mockups/${SAMPLE.project}/v3.html</span>
      <button onclick="S.maximized=true;render()" class="text-xs border rounded px-2 py-1 bg-white">⛶ 최대화 (F)</button>
    </div>
    <div class="flex-1 bg-white overflow-auto">${mockupFixture()}</div>
  </div>`;
}

// 목업 프리뷰 내용 (iframe 대체) — 실제 태스크 상세 화면 예시
function mockupFixture() {
  return `<div class="p-6 max-w-2xl">
    <div class="text-xs text-slate-400 mb-4">태스크 #142</div>
    <div class="flex items-start justify-between">
      <h1 class="text-2xl font-bold">로그인 페이지 리디자인</h1>
      <select class="border rounded px-3 py-1 bg-sky-50 text-sky-700">
        <option>In Progress</option><option>Todo</option><option>Done</option>
      </select>
    </div>
    <div class="grid grid-cols-2 gap-4 mt-4 text-sm">
      <div><div class="text-slate-400 text-xs">담당자</div>김하늘</div>
      <div><div class="text-slate-400 text-xs">마감일</div>2026-09-15</div>
    </div>
    <hr class="my-4">
    <div class="font-bold mb-2">댓글</div>
    <div class="space-y-3">
      <div class="text-sm"><b>이도현</b> <span class="text-slate-400 text-xs">2h</span><div>피그마 시안 공유했습니다.</div></div>
      <div class="text-sm"><b>김하늘</b> <span class="text-slate-400 text-xs">1h</span><div>확인 후 작업 시작할게요.</div></div>
    </div>
    <div class="flex gap-2 mt-4">
      <input class="flex-1 border rounded px-3 py-2" placeholder="댓글 작성...">
      <button class="bg-sky-600 text-white rounded px-4">등록</button>
    </div>
  </div>`;
}

function codeView() {
  const files = SAMPLE.codeFiles.map(f => `<span class="text-xs border border-orange-300 bg-orange-50 text-orange-700 rounded px-2 py-0.5">${f}</span>`).join(" ");
  return `<div class="p-4"><div class="flex flex-wrap gap-1 mb-3">${files}</div><div class="prose-sm">${md(SAMPLE.code)}</div></div>`;
}

function versionsView() {
  const rows = SAMPLE.versions.map((v, i) => `<tr class="border-b">
    <td class="px-2 py-2 font-mono">v${v.version}</td>
    <td class="px-2 py-2">${v.mode==='edit'?`✏ v${v.baseVersion} 수정`:'✨ 신규'}</td>
    <td class="px-2 py-2 text-slate-500">${v.createdAt}</td>
    <td class="px-2 py-2">${v.project} · ${(v.bytes/1024).toFixed(1)}KB</td>
    <td class="px-2 py-2"><button class="text-xs border rounded px-2 py-1 ${i===0?'bg-cyan-100':'bg-white'}">${i===0?'보는 중':'보기'}</button></td>
  </tr>`).join("");
  return `<div class="p-4"><table class="w-full text-sm"><tbody>${rows}</tbody></table></div>`;
}

function mainContent() {
  const view = S.devMode ? S.tab : S.custView;
  switch (view) {
    case "mockup": return mockupView();
    case "brief": return `<div class="p-4">${md(SAMPLE.brief)}</div>`;
    case "spec": return `<div class="p-4">${md(SAMPLE.spec)}</div>`;
    case "contract": return `<pre class="p-4 whitespace-pre-wrap text-xs">${SAMPLE.contract}</pre>`;
    case "code": return codeView();
    case "versions": return versionsView();
  }
}

function header() {
  const custActions = `
    <button class="border rounded px-2 py-1 bg-purple-100 border-purple-300">🪄 목업 생성 (C)</button>
    <button class="border rounded px-2 py-1 bg-white">🗂 템플릿 (T)</button>
    <div class="flex gap-1 items-center ml-2">
      ${["①요구정리","②목업생성","③API명세"].map((p,i)=>`<span class="text-xs border rounded px-2 py-0.5 ${i===1?'bg-sky-100 border-sky-400':'bg-white'}">${p}${i===0?' ✓':''}</span>`).join("")}
    </div>`;
  const devActions = `
    <input class="border rounded px-2 py-1 w-28" value="${SAMPLE.project}">
    ${["⓪캡처","①목업","②Freeze","③역도출","④코드생성"].map(a=>`<button class="border rounded px-2 py-1 bg-white text-xs">${a}</button>`).join("")}
    <button class="border rounded px-2 py-1 bg-white text-xs">🗂 템플릿</button>`;
  return `<div class="shrink-0 flex flex-wrap items-center gap-2">
    <span class="font-bold">Blueprint Agent</span>
    ${S.devMode ? devActions : custActions}
    <button onclick="S.devMode=!S.devMode;render()" class="ml-auto border rounded px-2 py-1 bg-white">${S.devMode?'✕ 고객모드로':'⚙'}</button>
  </div>
  ${S.err ? `<div class="shrink-0 text-red-600">⚠ ${S.err}</div>` : ""}`;
}

function tabbar() {
  const items = S.devMode ? DEV_TABS : CUST_VIEWS;
  const cur = S.devMode ? S.tab : S.custView;
  return items.map(t => `<button onclick="${S.devMode?'S.tab':'S.custView'}='${t.k}';render()"
    class="px-3 py-1 rounded text-xs ${cur===t.k?'bg-slate-800 text-white':'bg-slate-100 hover:bg-slate-200'}">${t.label}</button>`).join("");
}

function maximizeOverlay() {
  if (!S.maximized) return "";
  return `<div onclick="S.maximized=false;render()" class="fixed inset-0 z-50 bg-slate-900/95 flex items-center justify-center p-4">
    <div class="bg-white rounded shadow-2xl w-full max-w-4xl h-[85vh] overflow-auto" onclick="event.stopPropagation()">
      ${mockupFixture()}
    </div>
    <div class="absolute top-4 right-4 text-white text-xs">ESC 로 닫기</div>
  </div>`;
}

function render() {
  document.getElementById("root").innerHTML = `
    ${header()}
    <div class="flex-1 flex flex-col md:flex-row gap-2 min-h-0">
      <aside class="md:w-80 shrink-0 flex flex-col border rounded bg-white p-2 min-h-0">
        <div class="flex-1 min-h-0">${chatPanel()}</div>
        ${!S.devMode ? versionChips() : ""}
      </aside>
      <main class="flex-1 flex flex-col bg-white rounded border min-h-0">
        <div class="shrink-0 flex flex-wrap gap-1 p-2 border-b">${tabbar()}</div>
        <div class="flex-1 overflow-auto">${mainContent()}</div>
      </main>
    </div>
    ${maximizeOverlay()}`;
}

// 단축키
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key.toUpperCase();
  if (k === "F") { S.maximized = !S.maximized; render(); }
  else if (e.key === "Escape" && S.maximized) { S.maximized = false; render(); }
  else if (k === "D") { S.devMode = !S.devMode; render(); }
  else if (k === "T") { S.err = "템플릿 팝업 (예시에선 미구현)"; render(); setTimeout(()=>{S.err=null;render();},1500); }
  else if (!S.devMode && k === "R") { S.custView = "brief"; render(); }
  else if (!S.devMode && k === "M") { S.custView = "mockup"; render(); }
  else if (!S.devMode && k === "A") { S.custView = "spec"; render(); }
});

render();
</script>
</body>
</html>
