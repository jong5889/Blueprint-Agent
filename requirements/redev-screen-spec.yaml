# Blueprint Agent — 콘솔 화면 스펙 (v2 · 단일 고객 모드 · AI-readable)
# 목적: 다른 세션의 AI가 이 콘솔을 동일 수준으로 재개발하기 위한 단일 계약.
# v2 재검토: 개발자 모드 제거. 산출물은 목업 HTML · requirements.md · constraints.md 3종.
#   시각 계약(freeze)은 내부 엔진 — 화면에 노출하지 않는다.
# 규칙: 이 파일이 화면의 정본. 값/이벤트/상태명은 코드에 1:1 대응. 추측 금지.

meta:
  app: "Blueprint Agent 콘솔"
  type: "단일 페이지 앱(SPA), 단일 모드(고객). 모드 토글 없음"
  stack: { ui: React, lang: TypeScript, css: "TailwindCSS", md: "react-markdown + remark-gfm" }
  entry: "dashboard/index.html → src/main.tsx → <App/>"
  viewport_root: "h-screen flex flex-col gap-2 p-2 bg-slate-100 text-slate-800"

# ─────────────────────────────────────────────────────────────
# 1. 레이아웃 — 단일 셸
layout:
  header:
    left: "타이틀 'Blueprint Agent' (font-bold text-sm)"
    center: ["🪄 생성 (C)  # 단일 실행 버튼(runAuto)", "🗂 템플릿 (T)", "진행단계 칩"]
    right: "(모드 토글 없음)"
    error_line: "err 있으면 헤더 아래 빨간 줄 '⚠ {err}'"
  body: "flex-1, md 이상 좌우 2단, 모바일 세로"
  left_aside:                 # w-80(md)
    chat_panel:
      title: "대화 (회의 녹취)"
      body: "transcript를 parseTranscript로 버블화. '사용자:' 발화는 파랑·우측, 나머지 회색·좌측. 화자 라벨 회색 소자."
      autoscroll: "transcript 변경 시 최신으로"
      input_row: ["텍스트 입력(Enter=보내기)", "🎤 녹음/⏹ 토글(후순위)", "보내기"]
      empty: "transcript 없으면 '(녹취 로딩…)'"
    version_chips:
      label: "이전 버전 · {project}"
      chip: "v{version}[✏ if edit], 현재=cyan, edit=amber, 그 외=slate. 툴팁: {날짜}·{project}·{KB}KB·(신규|v{base}에서 수정)"
      empty: "(없음)"
  right_main:
    tabbar: "3버튼 — 🖼 목업 / 📋 requirements.md / 🚫 constraints.md"
    content: "선택된 뷰 렌더 (섹션 2)"
  maximize_overlay:
    trigger: "목업 상단 '⛶ 최대화 (F)'"
    render: "fixed inset-0 z-50 bg-slate-900/95, 1440×900 고정 캔버스를 previewScale로 등비 축소"
    scale: "min(innerWidth/1440,(innerHeight-44)/900), resize 시 재계산"

# ─────────────────────────────────────────────────────────────
# 2. 뷰 — 고유 3종. view 상태로 선택
views:
  mockup:                     # 🖼 목업 — 앱의 중심
    role: "생성된 목업 HTML을 iframe으로 프리뷰"
    render: { bar: "iframeSrc 경로 + '⛶ 최대화 (F)'", iframe: "src=iframeSrc, onLoad 시 같은-오리진이면 단축키 핸들러 주입" }
    initial_src: "/fixture.html"
    src_switching:
      - "목업 잡 완료 → 새 webPath로 전환(사용자가 직접 안 골랐을 때만, iframeUserSet=false)"
      - "버전 칩 클릭 → 해당 webPath, iframeUserSet=true"
    empty: "fixture.html(‘목업을 생성하면 표시됩니다’)"

  requirements:               # 📋 requirements.md — 도출 산출물
    role: "도출된 requirements.md(Markdown, GFM) 표시. 화면목적·데이터·FR-NN 기능요구·액션 + [근거:u-NNN]"
    render: "Md 렌더러(prose)로 requirementsMd"
    empty: "'생성을 실행하면 확정 화면에서 요구사항을 도출합니다 (requirements.md)'"
    source: "SSE 'requirements' 또는 /derive 잡 결과 j.requirementsMd"

  constraints:                # 🚫 constraints.md — 도출 산출물 + 사용자 확정 체크리스트
    role: "도출된 constraints.md 표시 + 제외 후보 체크리스트"
    render:
      doc: "Md 렌더러로 constraintsMd (발언 근거 제외항목 [근거:u-NNN] / 사용자 확정 [사용자 확정])"
      checklist: "흔한 제외 카테고리(인증·결제·알림·다국어·다크모드 등) 체크박스. 체크→ '사용자 확정' 제약으로 constraintsMd에 반영(POST /derive 재호출 또는 클라 병합). AI가 임의 추가 금지(C-3)."
    empty: "'생성을 실행하면 회의에서 언급된 제외/비목표를 정리합니다 (constraints.md)'"
    source: "SSE 'constraints' 또는 /derive 잡 결과 j.constraintsMd"

# ─────────────────────────────────────────────────────────────
# 3. 상태(state)
state:
  transcript: "string — 회의 녹취 전문. **localStorage['bp-transcript']에 영속**(없으면 GET /transcript 시드 1회). 발언 추가·새로고침해도 유지"
  draft: "string — 입력 중 발언"
  project: "string — localStorage['bp-project'], 기본 '태스크-상세'"
  versions: "VersionEntry[] — GET /versions (project로 필터 표시)"
  requirementsMd | constraintsMd: "string — 도출 문서 본문"
  iframeSrc: "string — 프리뷰 경로. 초기 '/fixture.html'"
  iframeUserSet: "boolean — 사용자가 버전을 직접 골랐는가(자동전환 억제)"
  view: "'mockup'|'requirements'|'constraints' — 기본 'mockup'"
  busy: "string — 진행 중 잡 경로('' = 유휴)"
  autoPhase: "'mockup'|'derive'|'done'|null — 단일 실행 체인 단계"
  elapsed: "number — 경과초"
  err: "string|null"
  exclusionChecklist: "{key,label,checked}[] — constraints 제외 후보 체크리스트"
  templates / tplOpen / recording / maximized / previewScale / sessionId: "보조 상태"

# ─────────────────────────────────────────────────────────────
# 4. 파이프라인 — 단일 실행 체인
pipeline:
  one_click:                  # 🪄 생성(C) / runAuto — 고객 유휴일 때
    steps: "POST /mockup(캡처+목업 통합, 서버가 신규/델타 판정) → POST /freeze(내부 계약, 동기) → POST /derive(requirements.md+constraints.md)"
    phase_display: "PHASES 2칩 [① 목업 생성 → ② 문서 도출], 현재 pulse, 완료 ✓"
    note: "freeze는 내부 단계 — 계약을 화면에 표시하지 않는다. derive 완료 시 view='requirements' 자동 전환"
  job_model:
    async_endpoints: [/mockup, /derive]
    sync_endpoints: [/freeze]
    async_flow: "POST(헤더 x-session-id) → 202 {ok,jobId,status:'running'} → GET /jobs/:id 폴링(2s, timeout 480s, miss 5)"
    busy_release: "call()/runAuto의 finally가 담당(SSE 아님)"
    trigger_retry: "postJob 3회 재시도. 4xx/'…first'/'LLM 환경'/'변경된 발언' 메시지는 즉시 throw"
  endpoints:
    "GET /transcript": "→ { transcript }  # localStorage 없을 때 시드"
    "GET /templates": "→ { templates: Template[] }"
    "GET /versions": "→ { versions: VersionEntry[] }"
    "POST /mockup": "{ project, transcript } → job.result { webPath, version, mode, brief }  # brief는 내부, UI 미표시"
    "POST /freeze": "(동기, 내부) { webPath } → { contract }  # UI는 결과를 derive 입력으로만 사용, 표시 안 함"
    "POST /derive": "{ contract, transcript, confirmedExclusions? } → job.result { requirementsMd, constraintsMd }"
    "GET /jobs/:id": "→ Job"
    "GET /events?sid=": "SSE 스트림(세션 스코프)"

# ─────────────────────────────────────────────────────────────
# 5. SSE — 세션 스코프(?sid=). busy 해제는 SSE가 하지 않음
sse:
  endpoint: "GET /events?sid={sessionId}"
  scope: "잡은 POST 시 x-session-id로 태그되고, 이벤트는 해당 세션 클라이언트에만 전송(타 세션 간섭 없음)"
  events:
    mockup: "→ setIframeSrc(webPath), iframeUserSet=false, fetchVersions"
    requirements: "→ setRequirementsMd, view='requirements'"
    constraints: "→ setConstraintsMd"
    error: "→ setErr(message)"
    stt-line: "{who,text} → transcript 추가(후순위)"
    job: "{jobId,kind,status} — 폴링 보조"

# ─────────────────────────────────────────────────────────────
# 6. 키보드 단축키 (INPUT/TEXTAREA/편집중 무시)
shortcuts:
  C: "유휴일 때 생성(runAuto)"
  F: "프리뷰 최대화 토글"
  T: "템플릿 팝업 토글"
  M: "view=mockup"
  R: "view=requirements"
  K: "view=constraints"
  Escape: "최대화 닫기"
  note: "iframe 로드 시 같은-오리진이면 동일 keydown 핸들러 주입"

# ─────────────────────────────────────────────────────────────
# 7. 데이터 타입
types:
  ChatMsg: { who: string, text: string }
  VersionEntry:
    { project: string, version: number, createdAt: "ISO", webPath: string, bytes: number,
      "mode?": "'create'|'edit'", "baseVersion?": number,
      "transcriptSnapshot?": string, "groundingIds?": "string[]", "briefSummary?": string }
  Template: { id: string, emoji: string, title: string, desc: string, category: string, project: string, transcript: string }

# ─────────────────────────────────────────────────────────────
# 8. 재구현 시 놓치기 쉬운 함정
gotchas:
  - "crypto.randomUUID는 보안 컨텍스트에만 존재 — genSessionId 폴백 필수(LAN http)"
  - "transcript는 localStorage 영속 — 새로고침해도 추가 발언 유지. 시드는 저장값 없을 때만 로드"
  - "SSE는 ?sid= 세션 스코프 — 전역 브로드캐스트 금지(타 세션이 iframe/문서를 바꾸는 버그 방지)"
  - "busy 해제는 SSE가 아니라 finally"
  - "freeze/계약은 내부 — 어떤 뷰로도 사용자에게 노출하지 않는다(C-1은 유지하되 UI 없음)"
  - "constraints 체크리스트 항목은 '사용자 확정'으로만 문서 편입 — AI 임의 추가 금지(C-3)"
  - "/versions는 전 프로젝트 반환 — project로 필터"
